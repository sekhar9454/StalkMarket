version: '3.8'

services:
  mongo:
    image: mongo:7
    container_name: proffnitt-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - proffnitt-net

  server:
    build: ./server
    container_name: proffnitt-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/proffnitt
      - JWT_SECRET=proffnitt_stock_watchlist_jwt_secret_2026
      - FINNHUB_API_KEY=${FINNHUB_API_KEY:-}
      - CLIENT_URL=http://localhost:3000
    depends_on:
      - mongo
    networks:
      - proffnitt-net

  client:
    build:
      context: ./client
      args:
        - VITE_API_URL=http://localhost:5000/api
    container_name: proffnitt-client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - server
    networks:
      - proffnitt-net

volumes:
  mongo_data:

networks:
  proffnitt-net:
    driver: bridge
